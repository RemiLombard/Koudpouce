# Configuration Netlify pour Koudpouce (Nuxt 3)

[build]
  # Commande de build
  command = "npm run build"
  # Dossier de sortie généré par Nuxt
  publish = ".output/public"
  # Fonctions serverless générées par Nuxt
  functions = ".output/server"

# Preset Nuxt pour Netlify (automatique avec nuxt build)
[build.environment]
  NODE_VERSION = "20"

# Redirections pour le mode SSR/hybrid
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
