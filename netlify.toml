# Configuration Netlify pour Koudpouce (Nuxt 3)

[build]
  # Commande de build
  command = "npm run build"
  # Dossier de sortie - Nuxt Netlify preset gère automatiquement
  publish = "dist"

# Version Node.js
[build.environment]
  NODE_VERSION = "20"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
